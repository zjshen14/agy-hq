# agy-hq Private Vault Configuration
vault_version: 1

channels:
  default: remote_control
  remote_control:
    enabled: true
  google_chat:
    enabled: false
    owner_space_id: ""
  telegram:
    enabled: false
    owner_chat_id: ""

quota:
  max_parallel_runs: 4
  max_daily_spawns: 15
  background_model: flash

routing:
  tiers:
    quick:
      model: gemini-3.8-flash-low
      subagent_model: flash_lite
    standard:
      model: gemini-3.8-flash-high
      subagent_model: flash
    deep:
      model: gemini-4-argon-high
      subagent_model: pro
  fallback_on_429: gemini-3.8-flash-medium

console:
  listen_addr: "127.0.0.1:4747"
