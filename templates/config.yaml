# agy-hq Private Vault Configuration
vault_version: 1

quota:
  max_parallel_runs: 4
  max_daily_spawns: 15

routing:
  front_desk_model: gemini-4-hydrogen-medium
  tiers:
    quick:
      model: gemini-4-hydrogen-low
      subagent_model: flash_lite
    routine:
      model: gemini-4-hydrogen-medium
      subagent_model: flash
    standard:
      model: gemini-4-neon-medium
      subagent_model: flash
    heavy:
      model: gemini-4-neon-high
      subagent_model: flash
    deep-medium:
      model: gemini-4-neon-high
      subagent_model: pro
    deep:
      model: gemini-4-carbon-high
      subagent_model: pro
  fallback_on_429: gemini-4-hydrogen-medium

attention:
  mode: balanced
  quiet_hours:
    start: "22:00"
    end: "07:00"
    tz: "America/Los_Angeles"
    allow_critical_breach: true
  cooldown_per_topic: "4h"
  coalesce_window: "3m"
  incident_correlation_window: "30m"
  # Optional scope attention rules (e.g. quiet personal alerts during weekday coding blocks):
  # scope_rules:
  #   - scopes: ["personal"]
  #     schedule: "weekdays 09:00-17:30 America/Los_Angeles"
  #     downgrade_non_critical_interrupt_to: "brief_rollup"

pulse:
  enabled: true
  pre_meeting_lead: "30m"
  countdown_horizons: ["168h", "72h", "24h"]
  cutoff_lead: "6h"
  min_slot_buffer: "45m"
  stale_draft_age: "4h"

living_spaces:
  # Locale-neutral framework default. Override in your private <vault>/config.yaml (e.g. ["en", "zh"]).
  default_locales: ["en"]
  default_surfaces: ["webui", "artifact"]

spaces:
  - id: morning-ops
    title: "Morning Command & Triage"
    schedule: "weekdays 06:30-10:00 America/Los_Angeles"
    widgets: [goals_summary, waiting_on_slas, ideas_feed]
  - id: market-watch
    title: "Market Close & Thesis Watch"
    schedule: "weekdays 12:30-14:30 America/Los_Angeles"
    scope: investing
    widgets: [thesis_status, tasks_scope, ideas_feed]
  - id: engineering
    title: "Active Engineering Pulse"
    schedule: "weekdays 10:00-18:00 America/Los_Angeles"
    scope: engineering
    widgets: [worktree_git_status, tasks_scope, goals_summary]

console:
  listen_addr: "127.0.0.1:4242"

approvals:
  # Owned GitHub/Git Forge repository globs (e.g. ["alice/*", "alice-org/*"]) used by third_party_only rules.
  owned_repos: []
  ask_ttl: "24h"
  proposal_ttl: "24h"
  reject_noop_commands: true
  # Built-in rules (`messaging`, `release_publish`, `pr_merge`, `forge_git`, `rsi_apply`,
  # `workspace_remove`, `workspace_own`, `workspace_auto_guard`) come from internal/approvals/policy.go.
  # Override modes (`always | third_party_only | auto_only | never`) or add custom categories below:
  # rules:
  #   - id: forge_git
  #     mode: always
  #   - id: cloud_infra
  #     description: "Production infrastructure state changes"
  #     mode: always
  #     commands:
  #       - '\b(?:terraform|tofu|pulumi)\s+(?:apply|destroy)\b'
