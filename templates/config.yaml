# agy-hq Private Vault Configuration
vault_version: 1

channels:
  default: remote_control
  remote_control:
    enabled: true
  google_chat:
    enabled: false
    owner_space_id: ""
  telegram:
    enabled: false
    owner_chat_id: ""

quota:
  max_parallel_runs: 4
  max_daily_spawns: 15
  background_model: flash

routing:
  tiers:
    quick:
      model: gemini-3.8-flash-low
      subagent_model: flash_lite
    standard:
      model: gemini-3.8-flash-high
      subagent_model: flash
    deep:
      model: gemini-4-carbon-high
      subagent_model: pro
  fallback_on_429: gemini-3.8-flash-medium

attention:
  mode: balanced
  quiet_hours:
    start: "22:00"
    end: "07:00"
    tz: "America/Los_Angeles"
    allow_critical_breach: true
  cooldown_per_topic: "4h"
  coalesce_window: "0s"

spaces:
  - id: morning-ops
    title: "Morning Command & Triage"
    schedule: "weekdays 06:30-10:00 America/Los_Angeles"
    widgets: [goals_summary, waiting_on_slas, ideas_feed]
  - id: market-watch
    title: "Market Close & Thesis Watch"
    schedule: "weekdays 12:30-14:30 America/Los_Angeles"
    scope: investing
    widgets: [thesis_status, tasks_scope, ideas_feed]
  - id: engineering
    title: "Active Engineering Pulse"
    schedule: "weekdays 10:00-18:00 America/Los_Angeles"
    scope: engineering
    widgets: [worktree_git_status, tasks_scope, goals_summary]

console:
  listen_addr: "127.0.0.1:4242"
