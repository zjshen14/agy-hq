# agy-hq Private Vault Configuration
vault_version: 1

channels:
  default: remote_control
  remote_control:
    enabled: true
  google_chat:
    enabled: false
    owner_space_id: ""
  telegram:
    enabled: false
    owner_chat_id: ""

quota:
  max_parallel_runs: 4
  max_daily_spawns: 15
  background_model: flash

routing:
  front_desk_model: gemini-4-hydrogen-medium
  tiers:
    quick:
      model: gemini-4-hydrogen-low
      subagent_model: flash_lite
    routine:
      model: gemini-4-hydrogen-medium
      subagent_model: flash
    standard:
      model: gemini-4-hydrogen-high
      subagent_model: flash
    heavy:
      model: gemini-4-hydrogen-xhigh
      subagent_model: flash
    deep_routine:
      model: gemini-4-carbon-medium
      subagent_model: pro
    deep:
      model: gemini-4-carbon-high
      subagent_model: pro
  fallback_on_429: gemini-4-hydrogen-medium

attention:
  mode: balanced
  quiet_hours:
    start: "22:00"
    end: "07:00"
    tz: "America/Los_Angeles"
    allow_critical_breach: true
  cooldown_per_topic: "4h"
  coalesce_window: "0s"

spaces:
  - id: morning-ops
    title: "Morning Command & Triage"
    schedule: "weekdays 06:30-10:00 America/Los_Angeles"
    widgets: [goals_summary, waiting_on_slas, ideas_feed]
  - id: market-watch
    title: "Market Close & Thesis Watch"
    schedule: "weekdays 12:30-14:30 America/Los_Angeles"
    scope: investing
    widgets: [thesis_status, tasks_scope, ideas_feed]
  - id: engineering
    title: "Active Engineering Pulse"
    schedule: "weekdays 10:00-18:00 America/Los_Angeles"
    scope: engineering
    widgets: [worktree_git_status, tasks_scope, goals_summary]

console:
  listen_addr: "127.0.0.1:4242"

approvals:
  # Owned GitHub/Git Forge repository globs (e.g. ["alice/*", "alice-org/*"]) used by third_party_only rules.
  owned_repos: []
  ask_ttl: "24h"
  proposal_ttl: "24h"
  reject_noop_commands: true
  # Modes: always | third_party_only | auto_only | never
  # Add custom categories (e.g. cloud_infra, payments) below with zero Go changes or rebuilds.
  rules:
    - id: messaging
      description: "Outbound email, chat, and direct external messaging"
      mode: always
      commands:
        - '\bgws\s+(gmail|chat)\s+(send|create|post|patch|update|delete)\b'
        - '(?:^|[;&|]\s*)(?:[A-Za-z_][A-Za-z0-9_]*=\S+\s+)*(?:["'']?(?:\S+/)?language_server["'']?\s+plugin-cli\s+)?["'']?(?:\S+/)?gmail(?:-[0-9]+)?["'']?\s+[^;&|\n]*\b(?:mutate\s+(?:send-message|send-draft|send-with-attachment|send|reply|forward)|send-message|send-draft)\b'
        - '\bhq\s+gmail\s+(?:send|reply|forward|send-draft)\b'
        - '\bhq\s+gchat\s+(?:send|reply|forward|send-draft)\b'
        - '\bchat\.googleapis\.com/v1/spaces/[^\s]*messages\b'
    - id: release_publish
      description: "Public releases, package registries, and production deployments"
      mode: always
      commands:
        - '\b(?:gh\s+release\s+create|npm\s+publish|pnpm\s+publish|yarn\s+publish|cargo\s+publish|twine\s+upload|gem\s+push|docker\s+push|helm\s+push|vercel\s+(?:--prod|deploy\s+--prod)|fly\s+deploy|netlify\s+deploy\s+--prod)\b'
    - id: pr_merge
      description: "Pull request merges (third-party always gated; owned repos auto-only)"
      mode: third_party_only
      target_resolver: github_pr
      commands:
        - '\bgh\s+pr\s+merge\b'
    - id: forge_git
      description: "Git pushes/tags and owned-repo issue/PR management"
      mode: auto_only
      target_resolver: git_remote
      commands:
        - '\bgit\s+push\b'
        - '\bgh\s+(?:(?:pr|issue)\s+(?:create|close|reopen|comment|edit|ready|review)|repo\s+(?:delete|rename)|api\b[^\n]*(?:-X\s*(?:POST|PUT|PATCH|DELETE)|--method(?:=|\s+)(?:POST|PUT|PATCH|DELETE)|(?:\s|^)-[fF]\s|--field\b|--raw-field\b))'
        - '\b(?:terraform\s+(?:apply|destroy)|kubectl\s+(?:apply|delete|patch))\b'
    - id: rsi_apply
      description: "Ring-0 self-modification, trust pins, & local console approval API"
      mode: always
      commands:
        - '\bhq\s+(?:rsi\s+apply|connector\s+apply-offer|extension\s+apply-trust)\b'
        - '(?:https?://[^\s"'']*|127\.0\.0\.1:\d+|localhost:\d+)/api/(?:approve|reject)\b'
    # Example custom category (uncomment to activate):
    # - id: cloud_infra
    #   description: "Production infrastructure state changes"
    #   mode: always
    #   commands:
    #     - '\b(?:terraform|tofu|pulumi)\s+(?:apply|destroy)\b'
