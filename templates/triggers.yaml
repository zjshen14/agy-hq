# Declarative Proactive Triggers & Inbox Routing Rules
schedules:
  - id: morning-brief
    cron: "CRON_TZ=America/Los_Angeles 30 7 * * *"
    mode: front_desk_cron
    model: gemini-4-hydrogen-medium
    delivery: interrupt
    skill: morning-brief
  - id: edgar-close-watch
    cron: "CRON_TZ=America/Los_Angeles 30 13 * * 1-5"
    mode: daemon_gatekeeper
    model: gemini-4-hydrogen-medium
    precheck_cmd: ["hq", "status", "--quiet"]
    dedup_mode: stdout_sha256
    delivery: interrupt_on_breach
    skill: thesis-check
  - id: sleep-consolidate
    cron: "CRON_TZ=America/Los_Angeles 30 23 * * *"
    mode: isolated_worker
    model: gemini-4-carbon-medium
    delivery: silent_ledger
    skill: sleep-consolidate

inbox_rules:
  - name: bank-statements
    extensions: [".csv", ".ofx", ".qfx"]
    skill: ledger-ingest
  - name: tax-forms
    extensions: [".pdf"]
    filename_regex: "(?i)(w-?2|1099|1098|k-?1|tax)"
    skill: tax-prep
  - name: sec-filings
    extensions: [".pdf", ".htm", ".html"]
    filename_regex: "(?i)(10-[kq]|8-k|earnings)"
    skill: thesis-check
