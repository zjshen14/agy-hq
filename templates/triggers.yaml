# Declarative Core OS Harness Schedules & Inbox Routing Rules
# Note: Keep triggers.yaml strictly for Core Harness OS background daemons
# and high-frequency 0-token Go/CLI gatekeepers. User-requested watches and
# reminders should use Antigravity's native `schedule` tool in conversation.
schedules:
  - id: gmail-inbox-watch
    cron: "CRON_TZ=America/Los_Angeles */15 7-22 * * *"
    mode: daemon_gatekeeper
    tier: quick
    precheck_cmd: ["hq", "watch", "precheck", "--connector=gmail", "--json"]
    precheck_timeout_ms: 45000
    dedup_mode: precheck_enqueues
    delivery: brief_rollup
    skill: inbox-triage
  - id: morning-brief
    cron: "CRON_TZ=America/Los_Angeles 30 7 * * *"
    mode: front_desk_cron
    tier: routine
    delivery: interrupt
    skill: morning-brief
  - id: sleep-consolidate
    cron: "CRON_TZ=America/Los_Angeles 30 23 * * *"
    mode: isolated_worker
    tier: deep_routine
    delivery: silent_ledger
    skill: sleep-consolidate

  # Optional example: custom 0-token gatekeeper schedule (disabled / example only)
  # - id: edgar-close-watch
  #   cron: "CRON_TZ=America/Los_Angeles 30 13 * * 1-5"
  #   mode: daemon_gatekeeper
  #   tier: routine
  #   precheck_cmd: ["hq", "status", "--quiet"]
  #   dedup_mode: stdout_sha256
  #   delivery: interrupt_on_breach
  #   skill: thesis-check

inbox_rules:
  - name: bank-statements
    extensions: [".csv", ".ofx", ".qfx"]
    skill: ledger-ingest
  - name: tax-forms
    extensions: [".pdf"]
    filename_regex: "(?i)(w-?2|1099|1098|k-?1|tax)"
    skill: tax-prep
  - name: sec-filings
    extensions: [".pdf", ".htm", ".html"]
    filename_regex: "(?i)(10-[kq]|8-k|earnings)"
    skill: thesis-check
